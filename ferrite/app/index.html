<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ferrite</title>
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#06080E">
  <style>
    html, body, #app { margin: 0; width: 100%; height: 100%; background: #06080E; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #828B9B;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <div id="loading">불러오는 중</div>
  <div id="app"></div>
  <script>
    // Compose renders into a canvas inside a shadow root, which selectors on
    // the light DOM cannot see, so look through shadow roots as well.
    function hasCanvas() {
      if (document.querySelector('canvas')) return true;
      var els = document.body.querySelectorAll('*');
      for (var i = 0; i < els.length; i++) if (els[i].shadowRoot && els[i].shadowRoot.querySelector('canvas')) return true;
      return false;
    }
    new MutationObserver(function (_, o) {
      if (hasCanvas()) { var l = document.getElementById('loading'); if (l) l.remove(); o.disconnect(); }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="ferrite.js"></script>
</body>
</html>
