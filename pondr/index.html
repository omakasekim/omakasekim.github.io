        return true;
      };
      if (cls === 'K') return true;
      if (cls === 'T') return refl();
      if (cls === 'S4') return refl() && trans();
      if (cls === 'S5') return refl() && trans() && eucl();
      if (cls === 'KD45') return ser() && trans() && eucl();
      return true;
    }

    function needsReflexivity(cls) {
      return cls === 'T' || cls === 'S4' || cls === 'S5';
    }

    function getBit(mask, bitIndex) {
      if (bitIndex < 31) return ((mask >>> bitIndex) & 1) === 1;
      return Math.floor(mask / (2 ** bitIndex)) % 2 === 1;
    }

    function runCheck() {
      const raw = document.getElementById('stmt').value;
      const cls = document.getElementById('frame').value;
      const n = parseInt(document.getElementById('worlds').value, 10);
      const statusEl = document.getElementById('status');
      const outEl = document.getElementById('output');

      try {
        const hasFormulaSyntax = /\b(K_|B_)|->|<->|~|!/.test(raw);
        const norm = hasFormulaSyntax ? raw : normalizeEnglish(raw);
        const f = parseFormula(norm);
        const agents = new Set(), atoms = new Set();
        collect(f, agents, atoms);
        const agentList = Array.from(agents);
        const atomList = Array.from(atoms);
        const numAgents = Math.max(1, agentList.length);
        const valBits = n * atomList.length;
        const relBits = n * n;
        const total = valBits + numAgents * relBits;

        if (total > 26) {
          throw new Error(`Search space too large (${total} boolean variables / ${2 ** total} models). Reduce worlds or distinct atoms/agents.`);
        }

        const limit = 2 ** total;
        const forceRefl = needsReflexivity(cls);
        let cm = null;

        for (let mask = 0; mask < limit; mask++) {
          const val = Array.from({ length: n }, (_, w) => {
            const o = {};
            atomList.forEach((a, ai) => {
              o[a] = getBit(mask, w * atomList.length + ai);
            });
            return o;
          });

          const acc = {};
          let frameOk = true;
          for (let agIdx = 0; agIdx < numAgents; agIdx++) {
            const agName = agentList[agIdx] || '_default';
            const baseBit = valBits + agIdx * relBits;
            const rel = Array.from({ length: n }, (_, w) =>
              Array.from({ length: n }, (_, u) =>
                getBit(mask, baseBit + w * n + u) || (forceRefl && w === u)
              )
            );
            if (!checkFrame(rel, n, cls)) {
              frameOk = false;
              break;
            }
            acc[agName] = rel;
          }

          if (!frameOk) continue;
          const m = { worlds: Array.from({ length: n }, (_, i) => i), val, acc };
          if (!evalF(m, 0, f)) {
            cm = { formula: norm, model: m, actual_world: 0, evaluates_to: false };
            break;
          }
        }

        if (cm) {
          statusEl.innerHTML = `<p class="bad">FALSIFIED in ${cls} (${n} worlds) — Countermodel found:</p>`;
          outEl.textContent = JSON.stringify(cm, null, 2);
        } else {
          statusEl.innerHTML = `<p class="ok">VALID: No countermodel found up to ${n} worlds in ${cls}.</p>`;
          outEl.textContent = `Formalized: ${norm}`;
        }
      } catch (e) {
        statusEl.innerHTML = `<p class="bad">Parse / Search Error</p>`;
        outEl.textContent = e.message;
      }
    }
  </script>
